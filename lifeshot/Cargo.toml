[package]
name = "lifeshot"
version = "0.1.0"
edition = "2021"
description = "screenshot + annotation tool for the niri olive rice: freeze, select, mark up, copy/save (flameshot-style, drawn in the rice's own glyphs)"
license = "GPL-3.0-or-later"
authors = ["Whyte Erminae"]

[dependencies]
# Same sctk + fontdue stack as lifelock/lifenote/lifeconf, pinned in lockstep.
smithay-client-toolkit = "=0.20.0"
fontdue = "0.9"
libc = "0.2"
# wlr-screencopy: the one protocol sctk doesn't wrap. It is already in the
# tree (sctk uses this crate for layer-shell).
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# PNG output: deflate + CRC are the only non-trivial parts of the format, so
# take those two and write the (tiny) container ourselves.
flate2 = "1"
crc32fast = "1"

[profile.release]
lto = true
strip = true
panic = "abort"
