# kitty/rice.conf sets listen_on=unix:${XDG_RUNTIME_DIR}/kitty/kitty-{kitty_pid}
# for socket-only remote control. kitty does not create the socket's parent
# directory, and /run/user/1000 is tmpfs — wiped every boot — so without this
# rule every kitty start prints "Invalid listen_on=..., ignoring".
# %t is XDG_RUNTIME_DIR in user tmpfiles.
#
# The Age field is deliberately left unset. kitty unlinks its socket on a clean
# exit but not when it is SIGKILLed or when the compositor dies, so stale
# sockets do collect here — but an age would also delete the socket of any kitty
# window that has simply been open longer than it (nothing touches the inode
# while the socket is in use), breaking live re-theming for exactly the
# long-lived terminals it matters most for. Dead sockets are handled where they
# are consumed instead: lifeconf's live::kitty connects first and unlinks the
# ones that refuse.
d %t/kitty 0700 - - -
