# What CI is for here: this repo is two installers, two niri configs and five
# Rust crates that all have to agree with each other. The failure mode it
# guards against is real and has happened — a change landing in install.sh and
# not in macbook/install.sh, or a config edit that only one of the two configs
# gets. Everything below is something you could run locally in a minute.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Parse check first: a syntax error makes every other result noise.
      - name: bash -n
        run: |
          shopt -s nullglob
          for f in bootstrap.sh install.sh greeter-install.sh macbook/install.sh \
                   macbook/system/*.sh scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      # -S warning, not the default: info/style notes are advisory here (see
      # CONTRIBUTING). -x follows `source`d files, which is how the installers
      # pick up scripts/config-region.sh.
      - name: shellcheck
        run: |
          shellcheck -S warning -x \
            bootstrap.sh install.sh greeter-install.sh macbook/install.sh scripts/*.sh

      # Every external command the code calls must be installed by the
      # installers, not just present on the dev machine.
      - name: external commands are in the package list
        run: bash scripts/check-deps.sh

      # The cheat sheet parses the niri config with awk. If that parser breaks,
      # the window silently comes up empty — so render both configs and insist
      # there is something in them.
      - name: shortcuts window renders both configs
        run: |
          for cfg in niri/config.kdl macbook/niri/config.kdl; do
            n=$(NIRI_CONFIG="$cfg" COLUMNS=100 bash scripts/shortcuts-window.sh --print | grep -c 'Mod+') || true
            echo "$cfg: $n binding rows"
            [ "$n" -ge 20 ] || { echo "::error::$cfg produced only $n rows"; exit 1; }
          done

  arch:
    name: configs + crates (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Before checkout: actions/checkout wants git, and the build needs a
      # toolchain plus the libraries the sctk/pam crates link against.
      - name: Install toolchain
        run: |
          # clang is not optional: lifelock's pam-client pulls in bindgen, whose
          # clang-sys build script needs libclang.so and panics without it.
          # mesa/libglvnd: lifewall --layer links libEGL (and wayland-egl).
          pacman -Syu --noconfirm --needed \
            base-devel git niri rust clang pam wayland libxkbcommon pkgconf mesa libglvnd

      - uses: actions/checkout@v4

      # config.kdl includes the machine's gitignored local.kdl, which the
      # installer makes from local.kdl.default — do the same here.
      - name: niri validate (both configs)
        run: |
          cp niri/local.kdl.default niri/local.kdl
          cp macbook/niri/local.kdl.default macbook/niri/local.kdl
          niri validate --config niri/config.kdl
          niri validate --config macbook/niri/config.kdl

      # Every fenced region the installers and Settings write into must exist
      # in BOTH local.kdl templates, or one machine silently never gets that
      # setting — and none may come back into a tracked config.kdl, where
      # writing it would dirty the checkout and block `git pull`.
      - name: fenced regions present in both local.kdl templates
        run: |
          status=0
          for cfg in niri/config.kdl macbook/niri/config.kdl; do
            ! grep -q 'LIFE\(CONF\|BRANCH\):BEGIN' "$cfg" \
              || { echo "::error file=$cfg::fenced region in a tracked config (belongs in local.kdl.default)"; status=1; }
            grep -qx 'include "local.kdl"' "$cfg" \
              || { echo "::error file=$cfg::does not include local.kdl"; status=1; }
          done
          for region in touchpad keyboard mouse nightlight; do
            for cfg in niri/local.kdl.default macbook/niri/local.kdl.default; do
              grep -q "LIFEBRANCH:BEGIN $region\$" "$cfg" \
                || { echo "::error file=$cfg::missing LIFEBRANCH region '$region'"; status=1; }
              grep -q "LIFEBRANCH:END $region\$" "$cfg" \
                || { echo "::error file=$cfg::unterminated LIFEBRANCH region '$region'"; status=1; }
            done
          done
          exit $status

      # The two installers drift: this is the check that catches it.
      - name: installers agree on the scripts they link
        run: |
          extract() { sed -n '/^SCRIPTS=(/,/)/p' "$1" | tr ' ()' '\n\n\n' | grep '\.sh$' | sort -u; }
          if ! diff <(extract install.sh) <(extract macbook/install.sh) > /tmp/d; then
            echo "::warning::installers link different script sets:"; cat /tmp/d
          fi
          for f in $(extract install.sh; extract macbook/install.sh | sort -u); do
            [ -f "scripts/$f" ] || { echo "::error::scripts/$f is linked but does not exist"; exit 1; }
          done

      - name: cargo build
        run: |
          for c in lifefont lifewall lifelock lifenote lifeconf lifegreet lifefiles lifeshot lifemenu lifeauth lifepanel lifeosd lifebar lifeportal lifecursor; do
            echo "::group::$c"
            cargo build --release --manifest-path "$c/Cargo.toml"
            echo "::endgroup::"
          done

      # The crates carry unit tests for the parts that are easy to get subtly
      # wrong and impossible to eyeball: the Life rules, the cube geometry, the
      # password buffer's zeroing, and the swayidle argv ordering (a `resume`
      # clause binds to the timeout before it, so inserting a step in the wrong
      # place silently re-points it). Building them without running them left
      # all of that unchecked.
      - name: cargo test
        run: |
          for c in lifefont lifewall lifelock lifenote lifeconf lifegreet lifefiles lifeshot \
                   lifemenu lifeauth lifepanel lifeosd lifebar lifeportal lifecursor; do
            echo "::group::$c"
            cargo test --release --manifest-path "$c/Cargo.toml"
            echo "::endgroup::"
          done
