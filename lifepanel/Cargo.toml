[package]
name = "lifepanel"
version = "0.1.0"
edition = "2021"
description = "Quick settings for LifeBranch: wifi, bluetooth, sound, brightness, power, do-not-disturb, removable drives"
license = "GPL-3.0-or-later"
authors = ["Whyte Erminae"]

[dependencies]
# Pinned in lockstep with ../lifelock, ../lifenote, ../lifegreet and ../lifemenu.
smithay-client-toolkit = "=0.20.0"
libc = "0.2"
lifefont = { path = "../lifefont" }  # lazy glyphs; see lifefont/Cargo.toml
# The wifi password typed into the panel.
zeroize = "1"

[profile.release]
lto = true
strip = true
panic = "abort"
