[package]
name = "lifeosd"
version = "0.1.0"
edition = "2021"
description = "Volume and brightness on-screen display for LifeBranch: a labelled pure-text bar"
license = "GPL-3.0-or-later"
authors = ["Whyte Erminae"]

[dependencies]
# Pinned in lockstep with ../lifelock, ../lifenote, ../lifemenu and ../lifepanel.
smithay-client-toolkit = "=0.20.0"
libc = "0.2"
lifefont = { path = "../lifefont" }  # lazy glyphs; see lifefont/Cargo.toml

[profile.release]
lto = true
strip = true
panic = "abort"
