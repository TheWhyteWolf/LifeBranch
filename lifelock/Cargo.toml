[package]
name = "lifelock"
version = "0.1.0"
edition = "2021"
description = "ext-session-lock screen locker for niri: an isometric Game of Life cube in shade blocks (companion to lifewall)"
license = "GPL-3.0-or-later"
authors = ["Whyte Erminae"]

[dependencies]
# Pinned: app.rs is written against the vendored 0.20.0 source (session_lock,
# seat/keyboard repeat semantics). Bump deliberately, re-verifying both.
smithay-client-toolkit = "=0.20.0"
libc = "0.2"
zeroize = "1"
fontdue = "0.9"
pam-client = "0.5"

[profile.release]
lto = true
strip = true
panic = "abort"

[profile.dev]
# The locker must never unwind through secure state in any build we might run.
panic = "abort"
