# /etc/systemd/sleep.conf.d/t2.conf — T2 Macs: s2idle suspend only.
# deep/S3 has been broken since the macOS Sonoma firmware update; hibernate
# (and suspend-then-hibernate) makes the T2's BCE controller cut Touch Bar USB
# power in a way it can never recover from. Do not re-enable them.
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
SuspendState=freeze
