# Vivid Cyan — Super Saturated: pure #00ffff accent.
[palette]
bg      = "#0a1515"
surface = "#0f1f1f"
border  = "#1f5151"
text    = "#52e0e0"
accent  = "#00ffff"
warn    = "#f9d51f"
urgent  = "#f44125"

[lifewall]
mature  = "#367d7d"
newborn = "#1bbebe"

