# Wayland platform selection. Read by the systemd USER manager, so these reach
# far more than niri's own children: systemd user units, and D-Bus-activated
# services that carry SystemdService= (Dolphin's org.freedesktop.FileManager1
# is one — it activates plasma-dolphin.service).
#
# This is why they are NOT in niri's environment {} block. That block only
# covers processes niri itself spawns, so Dolphin opened from fuzzel would be a
# Wayland client while the same Dolphin opened via a portal's "Show in file
# manager" stayed on XWayland — the same app on either side of the boundary
# depending on how it happened to be started. niri/config.kdl keeps a
# spawn-at-startup line that pushes these into the D-Bus activation environment
# as well, for the ~half of D-Bus services that still have no SystemdService=.
#
# Why force the platform at all: xwayland-satellite can't bridge drag-and-drop
# across the X11/Wayland boundary (Supreeeme/xwayland-satellite#133), so a drag
# only lands when source and target are on the SAME side of it. Native Wayland
# is the side worth standing on — nearly everything else here already is.
#
# TRADE-OFF, deliberate: X11-only apps are now on the far side from the file
# manager. Bitwig Studio is the one that matters on these machines — dragging a
# sample from Dolphin into Bitwig USED TO WORK (both were quietly on the one
# Xwayland server, an X11->X11 drag) and does not any more. What works instead
# is Dolphin -> Brave, Dolphin -> vesktop, Dolphin -> VS Code. You cannot have
# both directions; see README.md "Native Wayland" for the escape hatch.
#
# Also applies to the Plasma session (F3 at the greeter). Safe there: Plasma
# Wayland wants these anyway, and under Plasma X11 there is no WAYLAND_DISPLAY,
# so the wayland entry fails and xcb takes over.
#
# Changing this file needs a re-login: the systemd user manager reads
# environment.d when it starts, not on demand.

# Qt. Needs the platform plugin installed — qt6-wayland for Qt6, qt5-wayland
# for Qt5, both in PKGS. Note the plugin is the actual fix: with it missing,
# "wayland;xcb" falls back to xcb, which is exactly what no variable at all
# would have done. This line only pins the order (and drags Qt5 along, which
# would otherwise auto-select xcb more eagerly than Qt6 does).
QT_QPA_PLATFORM="wayland;xcb"

# Companion to niri's prefer-no-csd. niri draws the borders; stop QtWayland
# drawing its own titlebar frame on top of them now that Qt apps are Wayland
# clients rather than XWayland ones. (Chromium and Electron negotiate
# xdg-decoration on their own and may still draw their own frame.)
QT_WAYLAND_DISABLE_WINDOWDECORATION=1

# Electron: vesktop, VS Code. "auto" picks Wayland when WAYLAND_DISPLAY is set
# and X11 otherwise. NOT read by Chromium proper, so it does nothing for Brave
# — that one is pinned in brave/brave-flags.conf instead.
# Per-app opt-out: ~/.config/vesktop-flags.conf or code-flags.conf containing
# --ozone-platform=x11 (the Arch wrappers read those files).
# vesktop caveat: on Wayland its push-to-talk has no X11-style global key grab
# and needs the evdev path — your user in the `input` group — or it goes quiet.
ELECTRON_OZONE_PLATFORM_HINT="auto"
