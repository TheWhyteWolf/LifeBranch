# Rice extras — symlinked to ~/.config/kitty/rice.conf, included from kitty.conf.
# Slight transparency so the Game of Life wallpaper ghosts through terminals.
# Compositing a translucent terminal over an animated background is one of the
# few genuinely expensive things here, so the lite profile sets this to 1.0.
# LIFEBRANCH:BEGIN opacity
background_opacity 0.93
# LIFEBRANCH:END opacity

# Live re-theming: lifeconf pushes new colours to running terminals via
# `kitty @ set-colors` (socket-only, so no network exposure). Each kitty opens
# its own socket under $XDG_RUNTIME_DIR/kitty/; lifeconf enumerates them.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty/kitty-{kitty_pid}

# Unified rice font (regular weight only — bold is synthesized; falls back to
# kitty default until installed).
font_family ShureTechMono Nerd Font

# Full olive palette (was opt-in; the terminal is an everyday surface and
# should match the rest of the rice). olive.conf is symlinked next to this.
include olive.conf
