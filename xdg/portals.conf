# Portal routing for the niri session.
# lifebranch: file choosers · gtk: settings (dark theme), file-chooser fallback · gnome: screencast/screenshot on niri.
[preferred]
default=gtk
# File dialogs: lifeportal (lifefiles in pick mode), gtk's until it's built.
org.freedesktop.impl.portal.FileChooser=lifebranch;gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.ScreenShot=gnome
